# 5 年回测：只在手动点 “Run workflow” 时运行，结果写到 data/backtest.json（网站不读它，只用来对比买法）
name: 5 年回测

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 回测
        run: python3 scripts/backtest.py
      - name: 提交结果
        run: |
          git config user.name "money-bot"
          git config user.email "money-bot@users.noreply.github.com"
          git add data/backtest.json
          if git diff --cached --quiet; then
            echo "结果没有变化"
          else
            git commit -m "5 年回测 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
